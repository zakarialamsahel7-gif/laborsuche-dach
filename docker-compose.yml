version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - db_data:/app/instance
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
